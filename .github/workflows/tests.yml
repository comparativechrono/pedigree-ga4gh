name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest

  # The files pedigree-ga4gh writes, checked against phenopacket-tools' own
  # JSON schemas (fetched at a fixed commit; they are not part of this package).
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Get phenopacket-tools' JSON schemas
        run: |
          git init -q /tmp/ppt
          git -C /tmp/ppt fetch -q --depth 1 https://github.com/phenopackets/phenopacket-tools.git 7df8ecd1455098a410c1437be8eb00f87a43ba39
          git -C /tmp/ppt checkout -q FETCH_HEAD
      - name: Install
        run: python -m pip install ".[test]" jsonschema referencing
      - name: Test
        run: python -m pytest
        env:
          PHENOPACKET_TOOLS_SCHEMAS: /tmp/ppt/phenopacket-tools-validator-jsonschema/src/main/resources/org/phenopackets/phenopackettools/validator/jsonschema/v2
